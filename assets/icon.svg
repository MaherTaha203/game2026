<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- ONE LINE app icon. Original geometric mark derived from the game's core
       mechanic: a single continuous stroke through four dots. No third-party art. -->
  <rect width="128" height="128" rx="28" fill="#12141a"/>
  <polyline points="34,90 34,42 94,42 64,90 94,90"
            fill="none" stroke="#6ea8fe" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#e8eaf0">
    <circle cx="34" cy="90" r="8"/>
    <circle cx="34" cy="42" r="8"/>
    <circle cx="94" cy="42" r="8"/>
    <circle cx="64" cy="90" r="8"/>
    <circle cx="94" cy="90" r="8"/>
  </g>
</svg>
