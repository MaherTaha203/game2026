; ONE LINE — Godot export presets (placeholders only; NO credentials committed).
;
; Signing keystores/passwords and Apple team/provisioning values are intentionally
; blank and MUST be supplied via the local Godot editor or environment at build
; time (see docs/RELEASE.md and docs/HUMAN_ACTION_REQUIRED.md). Never commit
; signing material (see .gitignore).

[preset.0]

name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/android/one-line.aab"
encryption_include_filters=""
encryption_exclude_filters=""

[preset.0.options]

package/unique_name="com.example.oneline"
package/name="ONE LINE"
package/signed=true
version/code=1
version/name="1.0.0"
gradle_build/use_gradle_build=true
screen/immersive_mode=true
screen/orientation=1
; Portrait. Permissions intentionally minimal (no INTERNET requested).
permissions/internet=false
permissions/access_network_state=false

[preset.1]

name="iOS"
platform="iOS"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/ios/one-line.ipa"

[preset.1.options]

application/bundle_identifier="com.example.oneline"
application/name="ONE LINE"
application/short_version="1.0.0"
application/version="1"
application/signature=""
; Portrait only.
orientation/portrait=true
orientation/landscape_left=false
orientation/landscape_right=false
capabilities/access_wifi=false
